<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="足球场地占位图">
  <defs>
    <linearGradient id="fgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#223026"/>
      <stop offset="1" stop-color="#131b15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fgb)"/>
  <!-- 淡场地线 -->
  <g stroke="#ffffff" stroke-opacity="0.06" fill="none" stroke-width="2">
    <circle cx="400" cy="300" r="170"/>
    <line x1="230" y1="300" x2="570" y2="300"/>
  </g>
  <!-- 足球线稿：中心五边形 + 连线 -->
  <g stroke="#ffffff" stroke-opacity="0.85" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="400" cy="300" r="108"/>
    <polygon points="400,258 439,286 424,332 376,332 361,286"/>
    <line x1="400" y1="258" x2="400" y2="192"/>
    <line x1="439" y1="286" x2="502" y2="262"/>
    <line x1="424" y1="332" x2="462" y2="392"/>
    <line x1="376" y1="332" x2="338" y2="392"/>
    <line x1="361" y1="286" x2="298" y2="262"/>
  </g>
</svg>
